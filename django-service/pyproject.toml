[project]
name = "django-service"
version = "0.1.0"
description = "a django dashboard for demoing OAuth secure login"
readme = "README.md"
authors = [
    { name = "Corey", email = "coreypapin16@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "psycopg2-binary>=2.9.13",
]

[project.scripts]
django-service = "django_service:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
