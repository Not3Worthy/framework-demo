[project]
name = "framework-demo"
version = "0.1.0"
description = "The space maintains dependencies for all of its child projects in one place!"
readme = "README.md"
authors = [
    { name = "Corey", email = "coreypapin16@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
framework-demo = "framework_demo:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "fastapi-service",
    "django-service",
]
