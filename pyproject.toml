[project]
name = "framework-demo"
version = "0.1.0"
description = "maintains dependencies for all of its child projects in one place!"
readme = "README.md"
authors = [
    { name = "Corey", email = "coreypapin16@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "msal>=1.39.0",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pyjwt>=2.15.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
framework-demo = "framework_demo:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "fastapi-service",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.1",
]
